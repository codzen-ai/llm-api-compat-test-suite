# LLM API Compatibility Test Suite - Configuration Example
#
# Copy this file to config.yaml and fill in your values.
# config.yaml is gitignored by default.

providers:
  # Example: Test a third-party provider claiming OpenAI compatibility
  - name: "my-openai-compat-provider"
    base_url: "https://api.example.com"
    api_key_env: "MY_PROVIDER_API_KEY"     # Read API key from this env var
    # api_key: "sk-..."                    # Or hardcode directly (not recommended)
    api_format: "openai"                    # openai | anthropic | gemini
    # auth_type: "bearer"                  # bearer | x-api-key | x-goog-api-key (default: auto from api_format)
    models:
      - name: "openai/gpt-5.4-mini"         # Third-party's model identifier
        profile: "gpt-5.4-mini"              # OpenAI model to benchmark against (see model_profiles/)
        # profile_snapshot: "2025-03-15"    # Optional: pin a snapshot file; omit → latest

  # Example: Test an Anthropic-compatible provider
  # - name: "my-anthropic-compat-provider"
  #   base_url: "https://api.example.com"
  #   api_key_env: "ANTHROPIC_COMPAT_KEY"
  #   api_format: "anthropic"
  #   models:
  #     - name: "claude-sonnet-4-20250514"
  #       profile: "claude-sonnet-4"

  # Example: Test a Gemini-compatible provider
  # - name: "my-gemini-compat-provider"
  #   base_url: "https://generativelanguage.googleapis.com"
  #   api_key_env: "GEMINI_COMPAT_KEY"
  #   api_format: "gemini"
  #   models:
  #     - name: "gemini-2.0-flash"
  #       profile: "gemini-2.0-flash"

# `profile:` must match a directory under model_profiles/{api_format}/.
# Capabilities are read from the profile YAML (ground truth) — users do not
# declare them. To see what's available:
#   ls model_profiles/openai/
# To author a new profile: see model_profiles/README.md.

# Auth types (default is auto-detected from api_format):
#   bearer         - Authorization: Bearer <key>  (default for openai)
#   x-api-key      - x-api-key: <key>             (default for anthropic)
#   x-goog-api-key - x-goog-api-key: <key>        (default for gemini)

# CLI-only options:
#   --profile <name>           Required with --model; picks the benchmark profile
#   --profile-snapshot <date>  Pin a profile snapshot file; omit → latest
#   --ignore-profile           Recording mode: bypass capability filtering (profile authoring)
#   --no-verify-ssl            Disable SSL certificate verification
#   --auth-type                Override auth header type
