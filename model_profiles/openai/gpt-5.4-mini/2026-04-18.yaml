# Schema example — see src/model_profile.py::ModelProfile for the authoritative
# definition. Capabilities match the PR1 run of gpt-5.4-mini on api.openai.com
# (23 passed / 3 skipped); TODO 5 will tighten this against a richer marker set.

model: gpt-5.4-mini
snapshot: gpt-5.4-mini-2026-04-18
api_format: openai
created_at: 2026-04-18
source_endpoint: https://api.openai.com

# Capability markers must match names registered in pyproject.toml and
# attached to tests via @pytest.mark.capability(...). A marker absent from
# this list means the corresponding test is skipped for this model.
capabilities:
  - chat
  - streaming
  - tools
  - vision
  - logprobs
  # Deliberately omitted (validated in PR1):
  #   - max_tokens        — gpt-5.x requires max_completion_tokens
  #   - stop_sequences    — server rejects `stop`
  #   - embeddings        — chat model, not an embedding model
