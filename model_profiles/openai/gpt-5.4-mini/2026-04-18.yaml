# Schema example — see src/model_profile.py::ModelProfile for the authoritative
# definition. Capabilities validated against api.openai.com using
# `pytest --config --ignore-profile`, then classified per
# model_profiles/README.md (PASS + real capability → include; FAIL or
# ambiguous → omit).

model: gpt-5.4-mini
snapshot: gpt-5.4-mini-2026-04-18
api_format: openai
created_at: 2026-04-18
source_endpoint: https://api.openai.com

# Capability markers must match names registered in pyproject.toml and
# attached to tests via @pytest.mark.capability(...). A marker absent from
# this list means the corresponding test is skipped for this model.
capabilities:
  - chat
  - streaming
  - tools
  - vision
  - logprobs
  - max_completion_tokens
  - system_message
  - temperature
  - n_multi
  - top_p
  - frequency_penalty
  - presence_penalty
  - seed
  - json_mode
  - json_schema
  - performance
  - thinking
  # Deliberately omitted:
  #   - max_tokens        — gpt-5.x requires max_completion_tokens
  #   - stop_sequences    — server rejects `stop`
  #   - embeddings        — chat model, not an embedding model

# Latency budget for streaming responses. Median of N samples must be
# at or below these caps. Tune these against observed numbers from the
# official endpoint — they are placeholder defaults, not vendor SLOs.
performance:
  ttft_ms: 1500
  tpot_ms: 80
