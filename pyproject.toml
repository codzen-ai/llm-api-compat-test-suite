[project]
name = "llm-api-compat-test-suite"
version = "0.1.0"
description = "Test suite for verifying third-party LLM API compatibility with OpenAI, Anthropic, and Gemini APIs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "rich>=13.7",
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "ruff>=0.15.10",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "S",     # flake8-bandit (security)
    "A",     # flake8-builtins
    "RET",   # flake8-return
    "C90",   # mccabe (cyclomatic complexity)
    "ERA",   # eradicator (commented-out code)
    "T20",   # flake8-print
    "PTH",   # flake8-use-pathlib
    "ASYNC", # flake8-async
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "TCH"]  # assert + runtime fixture imports in tests
"unit_tests/**/*.py" = ["S101", "S311", "TCH"]
"conftest.py" = ["S101", "T201"]   # assert + print in conftest
# scripts/ are operator-facing CLIs: random.Random for sampling (S311) and
# defensive asserts on internal invariants (S101) are intentional.
"scripts/**/*.py" = ["S101", "S311"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
extraPaths = ["src", "tests", "scripts"]

# Tests work with dynamic JSON — suppress Unknown propagation from dict[str, Any]
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false

[[tool.pyright.executionEnvironments]]
root = "unit_tests"
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
# Tests legitimately reach into module internals (underscore-prefixed
# helpers); disabling reportPrivateUsage avoids forcing a public API
# surface just to be testable.
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests", "unit_tests"]
pythonpath = ["src", "tests", "scripts"]
markers = [
    # Names must match entries in model_profiles/.../*.yaml capabilities lists.
    # New markers are introduced alongside the test that depends on them;
    # see docs/profile-based-compatibility-testing.md for the vetting rules.
    "capability(name): test requires specific model capability (chat, streaming, tools, vision, embeddings, max_tokens, max_completion_tokens, stop_sequences, n_multi, logprobs, seed, json_mode, json_schema, system_message, temperature, top_p, frequency_penalty, presence_penalty, performance, thinking)",
]
